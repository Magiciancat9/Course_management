services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
      POSTGRES_DB: course_pms
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_pms"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}@db:5432/course_pms?schema=public"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
