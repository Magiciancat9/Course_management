name: CI and Docker Build

on:
  workflow_call:
  pull_request:
    branches:
      - lab5-staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    name: test-and-docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://coursepms:coursepms-ci-only@localhost:5432/course_pms_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-this-job

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coursepms
          POSTGRES_PASSWORD: coursepms-ci-only
          POSTGRES_DB: course_pms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursepms -d course_pms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          bash deploy/tests/test_teardown_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Prepare disposable CI database
        run: npm --prefix server run prisma:migrate

      - name: Run backend tests
        run: npm run test:server

      - name: Run frontend tests
        run: npm run test:client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build production application
        run: npm run build

      - name: Build Docker image
        run: docker build --tag course-pms:ci .
